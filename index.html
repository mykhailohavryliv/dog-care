        display: flex;
        gap: 8px;
        margin-bottom: 32px;
        flex-wrap: wrap;
      }
      .dc-price-tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink-2);
        background: var(--cream);
        border: 1.5px solid var(--line);
        white-space: nowrap;
        transition: background 0.18s, color 0.18s, border-color 0.18s,
          transform 0.15s, box-shadow 0.18s;
      }
      .dc-price-tab:hover {
        background: var(--white);
        color: var(--ink);
        border-color: var(--line-2);
        transform: translateY(-1px);
        box-shadow: var(--shadow-sm);
      }
      .dc-price-tab.active {
        background: var(--ink);
        color: var(--yellow);
        border-color: transparent;
      }
      .dc-price-tab-icon {
        display: flex;
        align-items: center;
        opacity: 0.55;
      }
      .dc-price-tab.active .dc-price-tab-icon {
        opacity: 1;
      }

      /* Panel: header + body stacked */
      .dc-price-panel {
        display: flex;
        flex-direction: column;
        border-radius: var(--radius-lg);
        overflow: hidden;
        border: 1.5px solid var(--line);
        box-shadow: var(--shadow-md);
        margin-bottom: 40px;
      }

      /* Dark header — full width */
      .dc-price-header {
        background: var(--ink);
        color: var(--cream);
        padding: 28px 40px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .dc-price-header-icon {
        width: 52px;
        height: 52px;
        background: var(--yellow);
        border-radius: 16px;
        display: grid;
        place-items: center;
        color: #fff;
        flex-shrink: 0;
      }
      .dc-price-header-text {
        flex: 1;
        min-width: 0;
      }
      .dc-price-header-title {
        font-family: var(--display);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.02em;
        color: var(--yellow);
        margin: 0 0 4px;
      }
      .dc-price-header-desc {
        font-size: 13.5px;
        color: rgba(255, 254, 247, 0.65);
        line-height: 1.5;
        margin: 0;
      }
      .dc-price-header-note {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        background: rgba(255, 254, 247, 0.08);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 12.5px;
        font-weight: 500;
        color: rgba(255, 254, 247, 0.7);
        line-height: 1.45;
        max-width: 260px;
        flex-shrink: 0;
      }

      /* Cream body */
      .dc-price-body {
        background: var(--cream);
        padding: 32px 40px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
      }
      .dc-price-body-split {
        grid-template-columns: 1fr;
        gap: 0;
      }

      /* Price rows */
      .dc-price-rows {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .dc-price-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
        border-radius: 12px;
        transition: background 0.15s;
      }
      .dc-price-row:hover {
        background: var(--white);
      }
      .dc-price-row-left {
        flex: 1;
        min-width: 0;
      }
      .dc-price-row-name {
        font-weight: 600;
        font-size: 15px;
      }
      .dc-price-row-dur {
        font-size: 12.5px;
        color: var(--ink-3);
        margin-top: 2px;
      }
      .dc-price-row-right {
        text-align: right;
        flex-shrink: 0;
      }
      .dc-price-row-amount {
        font-family: var(--display);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .dc-price-row-note {
        font-size: 11px;
        color: var(--ink-3);
        margin-top: 2px;
      }

      /* Smaller check inside pills */
      .dc-price-features .dc-check {
        width: 16px;
        height: 16px;
        background: var(--ink);
        flex-shrink: 0;
      }
      .dc-price-features .dc-check svg {
        width: 9px;
        height: 9px;
      }
      .dc-price-features .dc-check path {
        stroke: var(--cream);
      }

      /* Features block — always below price rows */
      .dc-price-features-area {
        border-top: 1.5px solid var(--line-2);
        padding-top: 22px;
        margin-top: 8px;
      }
      .dc-price-features-label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: 12px;
      }
      .dc-price-features {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
      }
      .dc-price-features li {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.3;
        background: var(--white);
        border: 1.5px solid var(--line);
        border-radius: 999px;
        padding: 7px 14px 7px 9px;
        white-space: nowrap;
      }

      /* Weight tabs */
      .dc-weighttabs {
        display: flex;
        gap: 6px;
        padding: 6px;
        background: var(--white);
        border: 1.5px solid var(--line);
        border-radius: 999px;
        margin-bottom: 16px;
        width: max-content;
      }
      .dc-weighttab {
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 13px;
        color: inherit;
        transition: background 0.15s, color 0.15s;
      }
      .dc-weighttab.active {
        background: var(--ink);
        color: var(--yellow);
      }

      /* CTA banner */
      .dc-pricing-cta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 32px 40px;
        background: var(--yellow);
        border-radius: var(--radius-lg);
        flex-wrap: wrap;
      }
      .dc-pricing-cta h4 {
        font-family: var(--display);
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .dc-pricing-cta p {
        margin: 0;
        font-size: 14.5px;
        color: rgba(255, 255, 255, 0.72);
        font-weight: 500;
      }

      /* ============ Pricing — package cards (grooming-style) ============ */
      .pkg-section {
        position: relative;
        /* Fully visible so the price cards' drop-shadow isn't clipped at the
           bottom. Horizontal bleed is already contained by body{overflow-x:clip},
           so no page-level horizontal scroll appears.
           NB: overflow-x:clip + overflow-y:visible does NOT keep Y visible —
           per spec, clip forces the paired visible axis to clip too. */
        overflow: visible;
      }
      .pkg-grid {
        display: grid;
        grid-template-columns: minmax(280px, 360px) 1fr;
        gap: 56px;
        align-items: start;
      }
      .pkg-left {
        align-self: start;
        position: sticky;
        top: 100px;
      }
      .pkg-badge {
        display: inline-flex;
        padding: 7px 16px;
        border-radius: 999px;
        background: var(--yellow-soft);
        color: var(--ink);
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .pkg-title {
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(28px, 3.4vw, 46px);
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--ink);
        margin: 18px 0 16px;
      }
      .pkg-title em {
        font-style: normal;
        color: var(--yellow-deep);
      }
      .pkg-desc {
        font-size: 16px;
        color: var(--ink-2);
        line-height: 1.6;
        max-width: 340px;
        margin: 0 0 30px;
      }
      .pkg-stage {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      /* Card reveal — matches grooming: blur + rise + scale as each scrolls in.
         Hooks into the global .reveal/.in-view IntersectionObserver. */
      .pkg-cell.reveal {
        transition:
          opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1),
          transform 1.1s cubic-bezier(0.16, 1, 0.3, 1),
          filter 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .pkg-cell.reveal:not(.in-view) {
        filter: blur(12px);
        transform: translateY(60px) scale(0.97);
      }
      /* reveal wrapper — hover lives on the card inside */
      .pkg-card {
        background: #fff;
        border-radius: 36px;
        border: 1px solid rgba(26, 24, 20, 0.05);
        box-shadow: 0 30px 70px rgba(26, 24, 20, 0.1);
        padding: 34px 36px;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.35s ease;
      }
      .pkg-card:hover {
        transform: translateY(-6px) scale(1.01);
        box-shadow: 0 42px 90px rgba(26, 24, 20, 0.16);
      }
      .pkg-card-top {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
      }
      .pkg-icon {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: var(--yellow);
        color: #fff;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .pkg-name {
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(21px, 2.3vw, 28px);
        letter-spacing: -0.02em;
        color: var(--ink);
        margin: 0;
      }
      .pkg-cat-desc {
        font-size: 14.5px;
        color: var(--ink-2);
        line-height: 1.5;
        margin: 0 0 18px;
      }
      .pkg-incl {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px 20px;
      }
      .pkg-incl li {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        color: var(--ink);
        font-weight: 600;
      }
      .pkg-chk {
        width: 19px;
        height: 19px;
        flex-shrink: 0;
        color: var(--yellow-deep);
      }
      .pkg-rows {
        list-style: none;
        margin: 0;
        padding: 14px 0 0;
        border-top: 1px solid rgba(26, 24, 20, 0.08);
      }
      .pkg-rows li {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        padding: 8px 0;

      /* ============ Zoomarket ============ */

        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 16px;

      .dc-zoomarket-mosaic-photo {
        aspect-ratio: 4/5;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--yellow-soft);
      }
      .dc-zoomarket-mosaic-card {
        background: var(--yellow);

      .dc-zoomarket-mosaic-num {

        font-size: 13px;
        font-weight: 600;
        margin-top: 10px;
        line-height: 1.3;
      }

      .dc-zoomarket-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;

      .dc-zoomarket-card {
        background: var(--white);
        border-radius: var(--radius-lg);

        flex-direction: column;

        transform: translateY(-4px);
        box-shadow: var(--shadow-md);

      .dc-zoomarket-card-photo {
        position: relative;
        aspect-ratio: 1 / 1;
        background: var(--yellow-soft);
        overflow: hidden;
      }
      .dc-zoomarket-card-icon {
        position: absolute;
        top: 14px;
        left: 14px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--yellow);
        display: grid;
        place-items: center;
        font-size: 18px;
      }
      .dc-zoomarket-card-body {
        padding: 20px 22px 22px;
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .dc-zoomarket-card h4 {
        font-family: var(--display);
        font-weight: 600;
        font-size: 17px;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
      }
      .dc-zoomarket-card p {
        font-size: 13px;
        color: var(--ink-3);
        margin: 0 0 16px;
        flex: 1;
      }
      .dc-zoomarket-card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 14px;
        border-top: 1px solid var(--line);

      .dc-zoomarket-card-price {

        font-size: 14.5px;
      }
      .dc-zoomarket-card-arrow {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--yellow);
        display: grid;
        place-items: center;
      }
      button.dc-zoomarket-card {
        border: 0;
        padding: 0;
        width: 100%;
      }

      /* ============ Zoomarket modal (single-column variant of dc-modal) ============ */
      .dc-modal.dc-modal-products {
        grid-template-columns: 1fr;
        max-width: 920px;
      }
      .dc-modal-products .dc-modal-body {
        padding: 44px 44px 36px;
        max-height: 86vh;
        overflow-y: auto;
      }
      .dc-zm-modal-head {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 28px;
      }
      .dc-zm-modal-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--yellow);
        display: grid;
        place-items: center;
        font-size: 28px;
        flex-shrink: 0;
      }
      .dc-zm-modal-title {
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(24px, 3vw, 32px);
        letter-spacing: -0.03em;

      .dc-zm-modal-sub {
        font-size: 14.5px;
        color: var(--ink-2);

      .dc-zm-modal-grid {

        gap: 18px;
        margin-bottom: 28px;
      }
      .dc-zm-product {
        background: var(--white);
        border-radius: var(--radius-md);

        transform: translateY(-2px);
        box-shadow: var(--shadow-sm);
        border-color: var(--yellow-deep);
      }
      .dc-zm-product-photo {
        aspect-ratio: 4/3;
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 14px;
        background: var(--yellow-soft);
      }
      .dc-zm-product h4 {
        font-family: var(--display);
        font-weight: 600;
        font-size: 15.5px;
        letter-spacing: -0.01em;
        line-height: 1.2;
        margin: 0 0 6px;
      }
      .dc-zm-product > p {
        font-size: 12.5px;
        color: var(--ink-3);
        margin: 0 0 14px;
        line-height: 1.4;
        flex: 1;
      }
      .dc-zm-product-price {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid var(--line);

        font-weight: 700;
        font-size: 17px;
        letter-spacing: -0.02em;
      }

        place-items: center;

        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }
      @media (max-width: 640px) {
        .dc-zm-modal-grid {
          grid-template-columns: 1fr;
        }
        .dc-modal-products .dc-modal-body {

          flex-wrap: wrap;

        .ctm-quote { font-size: 15.5px; }
        .dc-hero-grid {
          grid-template-columns: 1fr;
        }
        .dc-hero-card {
          padding: 40px 28px;

        .dc-booking-card {
          grid-template-columns: 1fr 1fr;

          padding: 32px;

        }
        .dc-team-grid {

        .dc-pricing-grid {
          grid-template-columns: 1fr;
        }
        .dc-testi-row {
          grid-template-columns: 1fr;
        }
        .dc-form-card {

        .dc-section {

          padding: 6px 6px 6px 14px;
        }
        .dc-burger {
          display: flex;
          margin-left: auto;
        }
        /* Process: switch from absolute-positioned bubbles around a circle
     to a clean vertical stack with the dog photo on top. */
        .dc-process-stage {
          flex-direction: column;
          align-items: stretch;
          gap: 14px;
          min-height: 0;
          max-width: 480px;
          margin: 0 auto;
          display: flex;
        }
        .dc-process-center {
          order: -1;
          width: 240px;
          height: auto;
          margin: 0 auto 12px;
          align-self: center;
        }
        .dc-bubble {
          position: static;
          width: 100%;
        }
        .dc-bubble::after {
          display: none;
        }
        /* Drop the directional fly-in (only made sense around the circle) */
        .dc-bubble-1.reveal:not(.in-view),
        .dc-bubble-2.reveal:not(.in-view),
        .dc-bubble-3.reveal:not(.in-view),
        .dc-bubble-4.reveal:not(.in-view),
        .dc-bubble-5.reveal:not(.in-view),
        .dc-bubble-6.reveal:not(.in-view) {
          transform: translateY(18px) scale(0.96);
        }
        .dc-section-head {
          flex-direction: column;
          align-items: start;
        }
        /* Head stacks vertically here — subtitle is no longer on the right,
           so left-align its text (overrides the desktop right-align) */
        .dc-section-head .dc-section-sub {
          text-align: left;
        }
        .dc-section-head--center {
          align-items: center;
          text-align: center;
        }
        .dc-section-head--center .dc-section-sub {
          text-align: center;
        }
        .dc-zoomarket-hero {
          grid-template-columns: 1fr;
          gap: 32px;
        }
        .dc-zoomarket-grid {
          grid-template-columns: 1fr 1fr;
        }
        .dc-price-header {
          flex-wrap: wrap;
          padding: 24px 28px;
          gap: 14px;
        }
        .dc-price-header-note {
          max-width: none;
          width: 100%;
        }
        .dc-price-header .dc-btn {
          align-self: flex-start;
        }
        .dc-price-body {
          padding: 28px;
        }
        .dc-pricing-cta {
          flex-direction: column;
          align-items: flex-start;
          padding: 24px;
        }
        .dc-pricing-cta .dc-btn {
          align-self: flex-start;
        }
        /* AboutBlock — stack content + photo vertically on tablets and below */
        #about {
          padding-bottom: 40px;
        }
        .dc-about-grid {
          grid-template-columns: 1fr;
          gap: 36px;
        }
        /* padding-bottom:60px on content was only meant to balance the tall
     2-col photo on desktop — stacked layout doesn't need that extra gap */
        .dc-about-content {
          padding-bottom: 0;
        }
        .dc-about-photo {
          min-height: auto;
          margin-bottom: 0;
          max-width: 280px;
        }
        /* Dog: in flow once stacked (not absolute) so it never overlaps the text above it */
        .dc-about-dog {
          position: static;
          width: 100%;
          height: auto;
        }
      }

      @media (max-width: 760px) {

    <script>
      class ImageSlot extends HTMLElement {
        connectedCallback() {
          if (this.hasChildNodes()) return;
          const src = this.getAttribute("src");
          const fit = this.getAttribute("fit") || "cover";
          this.style.display = "block";
          this.style.overflow = "hidden";
          if (src) {
            const img = document.createElement("img");
            img.src = src;
            img.alt = this.getAttribute("placeholder") || "";
            img.style.width = "100%";
            img.style.height = "100%";
            img.style.objectFit = fit;
            img.style.display = "block";
            this.appendChild(img);
          }
        }
      }
      if (!customElements.get("image-slot"))
        customElements.define("image-slot", ImageSlot);
    </script>

      // Dog Care — section components

      function Nav({ activeSection, onNav }) {
        const scrolled = false;
        const [menuOpen, setMenuOpen] = useState(false);
        // Lock body scroll + Esc-to-close while burger menu is open
        useEffect(() => {
          if (!menuOpen) return;
          const onKey = (e) => {
            if (e.key === "Escape") setMenuOpen(false);
          };
          document.addEventListener("keydown", onKey);
          const prev = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          return () => {
            document.removeEventListener("keydown", onKey);
            document.body.style.overflow = prev;
          };
        }, [menuOpen]);
        const links = [
          { id: "services", label: "Послуги" },
          { id: "grooming", label: "Грумінг", href: "grooming.html" },
          { id: "team", label: "Команда" },
          { id: "pricing", label: "Ціни" },
          { id: "contact", label: "Контакти" },
        ];
        const handleNav = (id) => {
          setMenuOpen(false);
          onNav(id);
        };
        return (
          <>
            <nav className={"dc-nav" + (scrolled ? " scrolled" : "")}>
              <div className="dc-wrap">
              <div className="dc-nav-inner">
                <div className="dc-logo">
                  <LogoNav height={44} />
                </div>
                <div className="dc-nav-links">
                  {links.map((l) => (
                    <a
                      key={l.id}
                      href={l.href || "#" + l.id}
                      className={
                        "dc-nav-link" +
                        (activeSection === l.id ? " active" : "")
                      }
                      onClick={
                        l.href
                          ? undefined
                          : (e) => {
                              e.preventDefault();
                              onNav(l.id);
                            }
                      }
                    >
                      {l.label}
                    </a>
                  ))}
                </div>
                <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: "8px" }}>
                  <a
                    href="#contact"
                    className="dc-btn dc-btn-light dc-nav-cta"
                    onClick={(e) => {
                      e.preventDefault();
                      onNav("contact");
                    }}
                  >
                    Записатися <Arrow />
                  </a>
                  <button
                    className={"dc-burger" + (menuOpen ? " open" : "")}
                    aria-label={menuOpen ? "Закрити меню" : "Відкрити меню"}
                    aria-expanded={menuOpen}
                    onClick={() => setMenuOpen(!menuOpen)}
                  >
                    <span></span>
                    <span></span>
                    <span></span>
                  </button>
                </div>
              </div>
              </div>
            </nav>
            {menuOpen && (
              <div
                className="dc-mobile-menu"
                onClick={() => setMenuOpen(false)}
              >
                <div
                  className="dc-mobile-menu-panel"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="dc-mobile-menu-head">
                    <LogoHorizontal height={28} color="var(--ink)" />
                    <button
                      className="dc-mobile-menu-close"
                      onClick={() => setMenuOpen(false)}
                      aria-label="Закрити"
                    >
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 18 18"
                        fill="none"
                      >
                        <path
                          d="M4 4l10 10M14 4L4 14"
                          stroke="currentColor"
                          strokeWidth="2"
                          strokeLinecap="round"
                        />
                      </svg>
                    </button>
                  </div>
                  <nav className="dc-mobile-menu-links">
                    {links.map((l) => (
                      <a
                        key={l.id}
                        href={l.href || "#" + l.id}
                        className={
                          "dc-mobile-menu-link" +
                          (activeSection === l.id ? " active" : "")
                        }
                        onClick={
                          l.href
                            ? undefined
                            : (e) => {
                                e.preventDefault();

          t.scrollBy({

            behavior: "smooth",
          });
        };

          <div className="dc-videos">
            <div className="dc-videos-head">
              <h3>Подивіться, як це у нас</h3>
              <div className="dc-videos-nav">

                  ›
                </button>

      function formatPhone(raw) {
        let digits = raw.replace(/\D/g, "");
        if (digits.startsWith("380")) digits = digits.slice(3);
        else if (digits.startsWith("0")) digits = digits.slice(1);
        digits = digits.slice(0, 9);
        let out = "+380";
        if (digits.length > 0) out += " " + digits.slice(0, 2);
        if (digits.length > 2) out += " " + digits.slice(2, 5);
        if (digits.length > 5) out += " " + digits.slice(5, 7);
        if (digits.length > 7) out += " " + digits.slice(7, 9);
        return out;
      }

          setActive(id);

            window.scrollTo({ top: 0, behavior: "smooth" });
          } else {
            document
              .getElementById(id)
              ?.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }

        // Track active section
        useEffect(() => {
          const ids = ["about", "services", "team", "pricing", "contact"];
          const onScroll = () => {
            let cur = "home";
            for (const id of ids) {
              const el = document.getElementById(id);
              if (el && el.getBoundingClientRect().top < 220) cur = id;
            }
            setActive(cur);
          };
          window.addEventListener("scroll", onScroll);
          onScroll();
          return () => window.removeEventListener("scroll", onScroll);
        }, []);

        // Scroll-reveal animations. Decorate key blocks with .reveal, stagger siblings,
        // then fade-up via IntersectionObserver as they enter the viewport.
        useEffect(() => {
          if (
            typeof window === "undefined" ||
            !("IntersectionObserver" in window)
          )
            return;
          // Card-like blocks glide up with a soft blur (grooming-style).
          const glideSelector = [
            ".dc-hero-card",
            ".dc-booking-card",
            ".dc-service-panel",
            ".dc-trainer",
            ".dc-pricegroup",
            ".pkg-cell",
            ".dc-zoomarket-card",
            ".dc-testi",
            ".dc-video",
            ".dc-form-card",
            ".dc-pricing-cta",
          ].join(",");
          // Everything else just fades/rises plainly.
          const plainSelector = [
            ".dc-bubble",
            ".dc-zoomarket-hero > *",
            ".dc-videos",
          ].join(",");
          const selector = glideSelector + "," + plainSelector;

          // Wait one frame so React has flushed all section nodes.
          const raf = requestAnimationFrame(() => {
            const els = Array.from(document.querySelectorAll(selector));
            const groups = new Map();
            els.forEach((el) => {
              el.classList.add("reveal");
              // Cards get the blurred glide-up variant.
              if (el.matches(glideSelector)) el.classList.add("from-bottom");
              const parent = el.parentElement;
              if (!groups.has(parent)) groups.set(parent, []);
              groups.get(parent).push(el);
            });
            groups.forEach((siblings) => {
              siblings.forEach((el, i) =>
                el.style.setProperty("--reveal-i", i),
              );
            });

            const io = new IntersectionObserver(
              (entries) => {
                entries.forEach((e) => {
                  if (e.isIntersecting) {
                    e.target.classList.add("in-view");
                    io.unobserve(e.target);
                  }
                });
              },
              { threshold: 0.12, rootMargin: "0px 0px -6% 0px" },
            );
            els.forEach((el) => io.observe(el));
            App._revealIO = io;

            // Scroll-scrubbed section headings — the signature grooming reveal:
            // headings rise + un-blur in step with scroll. Falls back to plain
            // visible headings if GSAP is unavailable or motion is reduced.
            const reduce = window.matchMedia(
              "(prefers-reduced-motion: reduce)",
            ).matches;
            if (!reduce && window.gsap && window.ScrollTrigger) {
              gsap.registerPlugin(ScrollTrigger);
              document
                .querySelectorAll(".dc-section-head")
                .forEach((el) => {
                  el.classList.add("scrub-rise");
                  gsap.fromTo(
                    el,
                    { autoAlpha: 0, y: 60, filter: "blur(8px)" },
                    {
                      autoAlpha: 1,
                      y: 0,
                      filter: "blur(0px)",
                      ease: "none",
                      scrollTrigger: {
                        trigger: el,
                        start: "top 90%",
                        end: "top 55%",
                        scrub: 0.8,
                      },
                    },
                  );
                });
              ScrollTrigger.refresh();
            }
          });

          return () => {
            cancelAnimationFrame(raf);
            App._revealIO?.disconnect();
            if (window.ScrollTrigger) {
              ScrollTrigger.getAll().forEach((t) => t.kill());
            }
          };
        }, []);

        return (
          <div className="dc-app">
            <Nav activeSection={active} onNav={navTo} />
            <Hero onBook={() => navTo("contact")} />
            <AboutBlock />
            <Services />
            <Process />
            <Team />
            <Pricing />
            <KinologVisit />
            {t.showMarquee && <Marquee />}
            <Testimonials />
            <ContactForm />
            <Footer />
            <LeadModal />

            {window.TweaksPanel && (
              <TweaksPanel title="Tweaks">
                <TweakSection label="Бренд">
                  <TweakColor
                    label="Акцент"
                    value={t.accent}
                    options={[
                      "#ffd23f",
                      "#ef233c",
                      "#F5A623",
                      "#FF9F4E",
                      "#A8D8B9",
                      "#F5C2DA",
                      "#7BB6E0",
                    ]}
                    onChange={(v) => setTweak("accent", v)}
                  />
                  <TweakSelect
                    label="Шрифт заголовків"
                    value={t.headingFont}
                    options={[
                      "Unbounded",
                      "Fraunces",
                      "Bricolage Grotesque",
                      "Space Grotesk",
                      "Sora",
                    ]}
                    onChange={(v) => setTweak("headingFont", v)}
                  />
                </TweakSection>
                <TweakSection label="Дрібниці">
                  <TweakToggle
                    label="Лапки на фоні"
                    value={t.showPaws}
                    onChange={(v) => setTweak("showPaws", v)}
                  />
                  <TweakToggle
                    label="Бігуча стрічка"
                    value={t.showMarquee}
                    onChange={(v) => setTweak("showMarquee", v)}
                  />
                </TweakSection>
              </TweaksPanel>
            )}
            <style>{`
        ${!t.showPaws ? ".dc-paws { display: none !important; }" : ""}
      `}</style>
          </div>
        );
      }

      function AboutBlock() {
        return (
          <section className="dc-section dc-about" id="about">
            <div className="dc-wrap">
              <div className="dc-about-grid">
                <div className="dc-about-content">
                  <div className="dc-eyebrow-text">Про школу</div>
                  <h2 className="dc-h2">
                    Школа №1 у Івано‑Франківську з{" "}
                    <em className="dc-about-highlight">командою</em>{" "}
                    професіоналів
                  </h2>
                  <p className="dc-about-lead">
                    Наша місія — допомогти тобі виховати із свого цуценяти чи
                    собаки справжнього друга та захисника. Навчаємо будувати
                    стосунки без криків, стресу та страху.
                  </p>
                  <div className="dc-about-bullets">
                    <div className="dc-about-bullet">
                      <div className="dc-about-bullet-ic">
                        <Heart size={18} />
                      </div>
                      <div>
                        <div className="dc-about-bullet-title">
                          Без криків і стресу
                        </div>
                        <div className="dc-about-bullet-sub">
                          Довіра замість муштри
                        </div>
                      </div>
                    </div>
                    <div className="dc-about-bullet">
                      <div className="dc-about-bullet-ic">
                        <PawPrint size={18} />
                      </div>
                      <div>
                        <div className="dc-about-bullet-title">
                          Індивідуальний підхід
                        </div>
                        <div className="dc-about-bullet-sub">
                          До кожного вихованця
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div className="dc-about-photo">
                  <img
                    className="dc-about-dog"
                    src="assets/images/dog%20about.png"
                    alt="Школа №1 у Івано-Франківську · 300+ вивчених собак"
                  />
                </div>
              </div>
            </div>
          </section>
        );
      }

      // Sync data from admin panel (localStorage)
      (function () {
        const map = [
          {
            key: "dc_trainers",
            arr: typeof TRAINERS !== "undefined" ? TRAINERS : null,
          },
          {
            key: "dc_services",
            arr: typeof SERVICES !== "undefined" ? SERVICES : null,
          },
          {
            key: "dc_pricing",
            arr: typeof PRICING_GROUPS !== "undefined" ? PRICING_GROUPS : null,
          },
        ];
        map.forEach(({ key, arr }) => {
          if (!arr) return;
          try {
            const raw = localStorage.getItem(key);
            if (raw) arr.splice(0, arr.length, ...JSON.parse(raw));
          } catch (e) {}
        });
      })();

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
    <script>
      // Prevent pinch-zoom (iOS Safari ignores user-scalable=no since iOS 10)
      document.addEventListener(
        "touchmove",
        function (e) {
          if (e.touches.length > 1) e.preventDefault();
        },
        { passive: false },
      );
      // Prevent double-tap zoom
      var _lastTap = 0;
      document.addEventListener(
        "touchend",
        function (e) {
          var now = Date.now();
          if (now - _lastTap < 300) e.preventDefault();
          _lastTap = now;
        },
        { passive: false },
      );
    </script>
  </body>
</html>
