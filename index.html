          [role="button"],
          summary,
          .dc-tab,
          .dc-weighttab,
          .dc-pill,
          .dc-trainer,
          .dc-bubble,
          .dc-zoomarket-card,
          .dc-nav-link,
          .dc-social,
          .dc-modal-close,
          select,
          label.dc-field
        ) {
        cursor: var(--paw-dark), pointer;
      }

      /* Dark buttons regardless of section — yellow cursor */
      .dc-btn-primary,
      .dc-booking-go,
      .dc-tab.active,
      .dc-nav-link.active {
        cursor: var(--paw-yellow), pointer;
      }
      /* On hover the primary/booking buttons invert to YELLOW — switch cursor to DARK */
      .dc-btn-primary:hover,
      .dc-booking-go:hover {
        cursor: var(--paw-dark), pointer;
      }
      /* Light/Ghost buttons invert to DARK on hover — switch cursor to YELLOW */
      .dc-btn-light:hover,
      .dc-btn-ghost:hover {
        cursor: var(--paw-yellow), pointer;
      }

      /* Modal overlay (dark backdrop) is clickable — yellow pointer */
      .dc-modal-overlay {
        cursor: var(--paw-yellow), pointer;
      }
      .dc-modal {
        cursor: var(--paw-dark), auto;
      }
      .dc-modal a,
      .dc-modal button,
      .dc-modal [role="button"],
      .dc-modal .dc-modal-close {
        cursor: var(--paw-yellow), pointer;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"],
      input[type="date"],
      input[type="number"],
      input[type="search"],
      input:not([type]),
      textarea,
      .dc-input {
        cursor: text;
      }
      :disabled,
      [disabled],
      [aria-disabled="true"] {
        cursor: not-allowed;
      }

      /* ============ Scroll reveal ============ */
      .reveal {
        opacity: 0;
        transform: translateY(40px) scale(0.96);
        transition:
          opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1),
          transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: calc(var(--reveal-i, 0) * 90ms);
        will-change: opacity, transform;
      }
      .reveal.in-view {
        opacity: 1;
        transform: none;
      }
      /* Soft blurred glide-up for cards — matches the grooming page's directional
         reveal. Applied on top of .reveal to card-like blocks via JS. */
      .reveal.from-bottom {
        transform: translateY(70px) scale(0.94);
        filter: blur(10px);
        transition:
          opacity 1.25s cubic-bezier(0.16, 1, 0.3, 1),
          transform 1.25s cubic-bezier(0.16, 1, 0.3, 1),
          filter 1.25s cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: calc(var(--reveal-i, 0) * 130ms);
        will-change: transform, opacity, filter;
      }
      .reveal.from-bottom.in-view {
        transform: none;
        filter: blur(0);
      }
      /* Scroll-scrubbed heading rise (driven by GSAP ScrollTrigger, same as
         grooming). No opacity is set here on purpose — if GSAP fails to load the
         headings stay visible; GSAP supplies the hidden from-state at runtime. */
      .scrub-rise {
        will-change: transform, opacity, filter;
      }
      /* Process bubbles: each flies in from its own edge, slightly tilted,
   for a snappier "appears around the dog" feel. Uses :not(.in-view)
   so .reveal.in-view's transform: none takes over after entry. */
      .dc-bubble.reveal {
        transition-duration: 1.15s;
        transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
      .dc-bubble-1.reveal:not(.in-view) {
        transform: translate(-120px, -30px) rotate(-6deg) scale(0.85);
      }
      .dc-bubble-2.reveal:not(.in-view) {
        transform: translate(120px, -30px) rotate(6deg) scale(0.85);
      }
      .dc-bubble-3.reveal:not(.in-view) {
        transform: translate(-160px, 0px) rotate(-4deg) scale(0.85);
      }
      .dc-bubble-4.reveal:not(.in-view) {
        transform: translate(160px, 0px) rotate(4deg) scale(0.85);
      }
      .dc-bubble-5.reveal:not(.in-view) {
        transform: translate(-120px, 30px) rotate(-6deg) scale(0.85);
      }
      .dc-bubble-6.reveal:not(.in-view) {
        transform: translate(120px, 30px) rotate(6deg) scale(0.85);
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal,
        .scrub-rise {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
          transition: none !important;
        }
        .dc-btn:hover,
        .dc-btn:active { transform: none; }
        .dc-btn:hover .dc-btn-arrow { transform: none; }
      }

      /* ============ Dog Care — Design tokens ============ */
      :root {
        --yellow: #ffd23f;
        --yellow-deep: #e6b800;
        --yellow-soft: #fff8d0;
        --cream: #fffdf0;
        --ink: #1a1814;
        --ink-2: #4a453c;
        --ink-3: #8a8378;
        --line: rgba(26, 24, 20, 0.08);
        --line-2: rgba(26, 24, 20, 0.14);
        --white: #ffffff;
        --shadow-sm: 0 2px 8px rgba(26, 24, 20, 0.06);
        --shadow-md: 0 12px 32px rgba(26, 24, 20, 0.08);
        --shadow-lg: 0 24px 64px rgba(26, 24, 20, 0.12);
        --radius-sm: 14px;
        --radius-md: 22px;
        --radius-lg: 32px;
        --radius-xl: 44px;
        --display: "Unbounded", system-ui, sans-serif;
        --body: "Manrope", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        touch-action: manipulation;
        overflow-x: clip;
      }
      body {
        font-family: var(--body);
        color: var(--ink);
        background: var(--yellow);
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        padding-top: 0;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      input,
      select,
      textarea {
        font-family: inherit;
        color: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        display: block;
        max-width: 100%;
      }

      /* ============ Layout ============ */
      .dc-app {
        min-height: 100vh;
        background: var(--yellow);
        overflow-x: clip;
        position: relative;
      }
      .dc-wrap {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 32px;
      }

      /* Background paw scatter */
      .dc-paws {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .dc-paw {
        position: absolute;
        opacity: 0.18;
      }

      /* ============ Nav ============ */
      /* Progressive ("mesh") blur pinned to the bottom of the viewport.
         Stacked layers with increasing blur + offset mask bands, so the blur
         ramps up smoothly toward the bottom and content sharpens as it scrolls up. */
      .dc-scroll-blur {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 130px;
        z-index: 40;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      /* Shown only after scrolling past the hero/header */
      .dc-scroll-blur.is-visible {
        opacity: 1;
      }
      .dc-scroll-blur-layer {
        position: absolute;
        inset: 0;
      }
      /* Cumulative stack: every layer is solid at the bottom and fades out at a
         different height, so coverage overlaps continuously (no banding/gaps).
         Smallest blur spans the whole zone; each larger blur reaches less far up. */
      .dc-scroll-blur-layer:nth-child(1) {
        backdrop-filter: blur(0.6px);
        -webkit-backdrop-filter: blur(0.6px);
        -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 100%);
        mask-image: linear-gradient(to top, #000 0%, transparent 100%);
      }
      .dc-scroll-blur-layer:nth-child(2) {
        backdrop-filter: blur(1.2px);
        -webkit-backdrop-filter: blur(1.2px);
        -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 84%);
        mask-image: linear-gradient(to top, #000 0%, transparent 84%);
      }
      .dc-scroll-blur-layer:nth-child(3) {
        backdrop-filter: blur(2.2px);
        -webkit-backdrop-filter: blur(2.2px);
        -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 68%);
        mask-image: linear-gradient(to top, #000 0%, transparent 68%);
      }
      .dc-scroll-blur-layer:nth-child(4) {
        backdrop-filter: blur(3.5px);
        -webkit-backdrop-filter: blur(3.5px);
        -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 52%);
        mask-image: linear-gradient(to top, #000 0%, transparent 52%);
      }
      .dc-scroll-blur-layer:nth-child(5) {
        backdrop-filter: blur(5.5px);
        -webkit-backdrop-filter: blur(5.5px);
        -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 36%);
        mask-image: linear-gradient(to top, #000 0%, transparent 36%);
      }
      .dc-scroll-blur-layer:nth-child(6) {
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 22%);
        mask-image: linear-gradient(to top, #000 0%, transparent 22%);
      }
      .dc-scroll-blur-layer:nth-child(7) {
        backdrop-filter: blur(13px);
        -webkit-backdrop-filter: blur(13px);
        -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 12%);
        mask-image: linear-gradient(to top, #000 0%, transparent 12%);
      }
      @media (max-width: 760px) {
        .dc-scroll-blur {
          height: 90px;
        }
      }

      .dc-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 50;
        /* Top state: full-width bar (no side gap). On scroll, side+top gaps
           appear and the bar contracts into a centered pill. */
        padding: 0;
        transition: padding 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* Nav ignores the page wrap so its bar can span the full width */
      .dc-nav .dc-wrap {
        max-width: none;
        padding: 0;
      }
      .dc-nav.scrolled {
        padding: 10px clamp(16px, calc((100vw - 1180px) / 2), 400px);
      }
      .dc-nav-inner {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        /* Top state: full-width, square, blurred + lightly tinted */
        background: rgba(20, 16, 12, 0.22);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 0 solid rgba(255, 255, 255, 0.55);
        border-radius: 0;
        padding: 14px 40px;
        box-shadow: none;
        transition: background 0.45s ease, border-radius 0.45s ease,
          border-width 0.45s ease, border-color 0.45s ease,
          padding 0.45s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.45s ease;
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
      }
      .dc-nav.scrolled .dc-nav-inner {
        background: rgba(255, 255, 255, 0.85);
        border-width: 5px;
        border-radius: 999px;
        padding: 7px 7px 7px 22px;
        box-shadow: 0 8px 36px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.08);
      }
      .dc-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 22px;
        flex-shrink: 0;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      /* Logo parts recolor smoothly between states */
      .dc-logo .ln-disc,
      .dc-logo .ln-dog,
      .dc-logo .ln-word,
      .dc-logo .ln-accent {
        transition: fill 0.45s ease;
      }
      /* ===== Top (non-scrolled) state over the video: white logo, links, CTA ===== */
      .dc-nav:not(.scrolled) .dc-logo {
        color: #fff;
      }
      /* White disc, dark dog (so it stays visible), white wordmark */
      .dc-nav:not(.scrolled) .ln-disc {
        fill: #fff;
      }
      .dc-nav:not(.scrolled) .ln-dog {
        fill: #1a1814;
      }
      .dc-nav:not(.scrolled) .ln-word {
        fill: #fff;
      }
      .dc-nav:not(.scrolled) .dc-nav-link {
        color: rgba(255, 255, 255, 0.92);
      }
      .dc-nav:not(.scrolled) .dc-nav-link:hover {
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }
      .dc-nav:not(.scrolled) .dc-nav-link.active {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      .dc-nav:not(.scrolled) .dc-nav-cta.dc-btn-light {
        background: transparent;
        color: #fff;
        border: 1.5px solid rgba(255, 255, 255, 0.85);
      }
      .dc-nav:not(.scrolled) .dc-nav-cta.dc-btn-light:hover {
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }
      .dc-nav:not(.scrolled) .dc-nav-cta.dc-btn-light .dc-btn-arrow {
        background: #fff;
        color: var(--ink);
      }
      .dc-nav:not(.scrolled) .dc-nav-cta.dc-btn-light:hover .dc-btn-arrow {
        background: #fff;
        color: var(--ink);
      }
      .dc-logo-mark {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--yellow);
        display: grid;
        place-items: center;
        font-size: 22px;
      }
      .dc-nav-links {
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: center;
      }
      .dc-nav-link {
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 14px;
        color: var(--ink-2);
        transition: background .15s, color .15s;
      }
      .dc-nav-link:hover {
        background: rgba(26,24,20,0.07);
        color: var(--ink);
      }
      .dc-nav-link.active {
        background: var(--yellow);
        color: #fff;
      }
      .dc-nav-cta {
        margin-left: 4px;
        padding: 10px 20px;
        font-size: 13px;
        transition: background 0.45s ease, color 0.45s ease,
          border-color 0.45s ease;
      }
      .dc-nav-link {
        transition: background 0.3s ease, color 0.3s ease;
      }
      .dc-nav .dc-btn-light {
        background: var(--ink);
        color: #fff;
      }
      .dc-nav .dc-btn-light:hover {
        background: var(--yellow);
        color: #fff;
      }
      .dc-nav .dc-btn-light .dc-btn-arrow {
        background: var(--yellow);
        color: #fff;
      }
      .dc-nav .dc-btn-light:hover .dc-btn-arrow {
        background: #fff;
        color: var(--yellow);
      }

      /* ============ Burger menu (mobile) ============ */
      .dc-burger {
        display: none;
        width: 44px;
        height: 44px;
        background: var(--yellow);
        border: none;
        border-radius: 50%;
        padding: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: background 0.15s, transform 0.15s;
        flex-shrink: 0;
      }
      .dc-burger:hover {
        background: var(--yellow-deep);
        transform: scale(1.06);
      }
      .dc-burger span {
        display: block;
        width: 20px;
        height: 2px;
        background: #fff;
        border-radius: 2px;
        transition:
          transform 0.25s,
          opacity 0.15s;
        transform-origin: center;
      }
      .dc-burger.open span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      .dc-burger.open span:nth-child(2) {
        opacity: 0;
      }
      .dc-burger.open span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }

      .dc-mobile-menu {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(26, 24, 20, 0.42);
        backdrop-filter: blur(8px);
        animation: dc-fadein 0.2s ease;
      }
      .dc-mobile-menu-panel {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        background: var(--cream);
        padding: 22px 22px 28px;
        display: flex;
        flex-direction: column;
        border-radius: 0 0 28px 28px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18);
        animation: dc-slide-in-top 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
        overflow-y: auto;
        max-height: 90dvh;
      }
      @keyframes dc-slide-in-top {
        from {
          transform: translateY(-100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .dc-mobile-menu-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }
      .dc-mobile-menu-close {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--yellow);
        color: var(--ink);
        display: grid;
        place-items: center;
        transition: transform 0.15s;
      }
      .dc-mobile-menu-close:hover {
        transform: rotate(90deg);
      }
      .dc-mobile-menu-links {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 24px;
      }
      .dc-mobile-menu-link {
        padding: 14px 18px;
        font-size: 17px;
        font-weight: 600;
        border-radius: 14px;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .dc-mobile-menu-link:hover {
        background: rgba(26, 24, 20, 0.06);
      }
      .dc-mobile-menu-link.active {
        background: var(--yellow);
        color: var(--ink);
      }
      .dc-mobile-menu-cta {
        margin-top: 20px;
        justify-content: center;
        width: 100%;
      }

      /* ============ Buttons ============ */
      .dc-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 26px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 15px;
        position: relative;
        background-repeat: no-repeat;
        background-position: center bottom;
        background-size: 100% 0;
        transition:
          transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.3s ease,
          background-size 0.35s ease,
          background-color 0.25s ease,
          color 0.25s ease;
        white-space: nowrap;
      }
      /* Springy lift + scale */
      .dc-btn:hover {
        transform: translateY(-2px) scale(1.04);
      }
      .dc-btn:active {
        transform: translateY(0) scale(0.97);
        transition-duration: 0.1s;
      }
      /* Arrow glides to the right on hover */
      .dc-btn:hover .dc-btn-arrow {
        transform: translateX(3px);
      }
      .dc-btn-primary {
        background-color: var(--yellow-soft);
        background-image: linear-gradient(var(--yellow), var(--yellow));
        color: var(--ink);
      }
      /* Hover: yellow fill sweeps up from the bottom + soft glow, arrow flips too */
      .dc-btn-primary:hover {
        background-size: 100% 100%;
        color: var(--ink);
        box-shadow: 0 12px 28px rgba(255, 210, 63, 0.5);
      }
      .dc-btn-primary:hover .dc-btn-arrow {
        background: #fff;
        color: var(--ink);
      }
      /* Default arrow inside primary button: solid red circle with white arrow */
      .dc-btn-primary .dc-btn-arrow {
        background: var(--yellow);
        color: #fff;
      }
      .dc-btn-light {
        background-color: var(--white);
        background-image: linear-gradient(var(--ink), var(--ink));
        color: var(--ink);
      }
      /* Dark fill sweeps up on hover + soft glow */
      .dc-btn-light:hover {
        background-size: 100% 100%;
        color: var(--yellow);
        box-shadow: 0 12px 28px rgba(26, 24, 20, 0.3);
      }
      .dc-btn-ghost {
        background-color: transparent;
        background-image: linear-gradient(var(--ink), var(--ink));
        color: var(--ink);
        border: 1.5px solid var(--ink);
      }
      .dc-btn-ghost:hover {
        background-size: 100% 100%;
        color: var(--yellow);
        box-shadow: 0 12px 28px rgba(26, 24, 20, 0.3);
      }
      .dc-btn-ghost:hover .dc-btn-arrow {
        background: var(--yellow);
        color: var(--ink);
      }
      /* When these light/ghost buttons invert to dark on hover, the cursor must be
   yellow so it doesn't disappear against the dark bg (especially in
   yellow sections where the default pointer is dark). */
      .dc-btn-light:hover,
      .dc-btn-ghost:hover {
        cursor: var(--paw-yellow), pointer;
      }
      .dc-btn-yellow {
        background: var(--yellow);
        color: var(--ink);
      }
      .dc-btn-yellow:hover {
        background: var(--yellow-deep);
        box-shadow: 0 12px 28px rgba(239, 35, 60, 0.38);
      }
      .dc-btn-arrow {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--yellow);
        color: var(--ink);
        display: grid;
        place-items: center;
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .dc-btn-primary .dc-btn-arrow {
        background: var(--yellow);
      }

      /* ============ Hero ============ */
      .dc-hero {
        position: relative;
        padding: 0;
        margin-top: 0;
      }
      /* Hero spans the full viewport width (breaks out of .dc-wrap) */
      .dc-hero .dc-wrap {
        max-width: none;
        padding: 0;
      }
      .dc-hero-card {
        background: var(--cream);
        border-radius: 0;
        padding: 140px 40px 96px;
        position: relative;
        overflow: hidden;
        min-height: 680px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Background video filling the hero card */
      .dc-hero-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* Shift the crop toward the bottom so the dog's muzzle stays in view */
        object-position: center 80%;
        z-index: 0;
      }
      /* Light gradient over the video for text readability */
      .dc-hero-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          180deg,
          rgba(20, 16, 12, 0.35) 0%,
          rgba(20, 16, 12, 0.2) 40%,
          rgba(20, 16, 12, 0.5) 100%
        );
      }
      /* Wavy transition from the hero into the next (red) section */
      .dc-hero-wave {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        width: 100%;
        height: 90px;
        z-index: 2;
        display: block;
        pointer-events: none;
      }
      .dc-hero-content {
        position: relative;
        z-index: 3;
        max-width: 1000px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .dc-hero-content > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      /* White text on the video for contrast */
      .dc-hero-content .dc-h1,
      .dc-hero-content .dc-hero-sub,
      .dc-hero-content .dc-stat-num,
      .dc-hero-content .dc-stat-label {
        color: #fff;
      }
      .dc-hero-content .dc-h1 {
        font-weight: 500;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
      }
      /* Highlighted word ("хвостиків") — no shadow ring or text shadow */
      .dc-hero-content .dc-h1 em {
        box-shadow: none;
        text-shadow: none;
      }
      .dc-hero-content .dc-hero-sub {
        margin-left: auto;
        margin-right: auto;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.3);
      }
      .dc-hero-content .dc-hero-ctas {
        justify-content: center;
      }
      /* "Наші послуги" — white outline only, transparent background */
      .dc-hero-content .dc-btn-ghost {
        background-color: transparent;
        background-image: linear-gradient(#fff, #fff);
        color: #fff;
        border-color: #fff;
      }
      .dc-hero-content .dc-btn-ghost:hover {
        color: var(--ink);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      }
      .dc-hero-content .dc-btn-ghost:hover .dc-btn-arrow {
        background: var(--ink);
        color: #fff;
      }
      .dc-hero-content .dc-hero-stats {
        justify-content: center;
      }
      .dc-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 18px 6px 6px;
        border-radius: 999px;
        background: var(--yellow-soft);
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 22px;
      }
      .dc-eyebrow-dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--yellow);
        display: grid;
        place-items: center;
        font-size: 12px;
        color: #fff;
      }
      .dc-h1 {
        font-family: var(--display);
        font-size: clamp(40px, 5.2vw, 68px);
        line-height: 1.02;
        letter-spacing: -0.035em;
        font-weight: 700;
        margin: 0 0 22px;
        text-wrap: pretty;
      }
      .dc-h1 em {
        font-style: normal;
        background: var(--yellow);
        color: #fff;
        padding: 0 18px;
        border-radius: 18px;
        display: inline-block;
        margin: 4px 0;
        box-shadow: 0 0 0 6px var(--yellow-soft);
      }
      .dc-hero-sub {
        font-size: 17px;
        color: var(--ink-2);
        max-width: 720px;
        margin: 0 0 30px;
        text-wrap: pretty;
      }
      .dc-hero-ctas {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 36px;
      }
      .dc-hero-stats {
        display: flex;
        gap: 36px;
        flex-wrap: wrap;
      }
      .dc-stat-num {
        font-family: var(--display);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .dc-stat-label {
        font-size: 12.5px;
        color: var(--ink-3);
        margin-top: 4px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      /* Hero image — yellow circle backdrop with dog photo overlaid on top */
      .dc-hero-photo {
        position: relative;
        aspect-ratio: 1 / 1.05;
        width: 100%;
      }
      .dc-hero-photo-circle {
        position: absolute;
        left: 8%;
        bottom: 4%;
        width: 78%;
        aspect-ratio: 1 / 1;
        background: var(--yellow);
        border-radius: 50%;
        z-index: 0;
      }
      .dc-hero-slot {
        position: absolute;
        left: 8%;
        bottom: 4%;
        width: 78%;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        overflow: hidden;
        z-index: 1;
      }
      /* When the hero image already has the yellow circle baked in (transparent PNG),
   skip the CSS circle and let the image render full height without clipping. */
      .dc-hero-photo--composed {
        margin-top: -56px;
      }
      .dc-hero-photo--composed .dc-hero-photo-circle {
        display: none;
      }
      .dc-hero-photo--composed .dc-hero-slot {
        inset: 0;
        left: 0;
        bottom: 0;
        width: 100%;
        aspect-ratio: auto;
        height: 100%;
        border-radius: 0;
        overflow: visible;
        background: transparent;
      }
      .dc-hero-photo--composed .dc-hero-slot img {
        object-position: center top;
      }
      .dc-photo-tag {
        position: absolute;
        z-index: 3;
        background: var(--white);
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: var(--shadow-md);
      }
      .dc-photo-tag-1 {
        top: 42%;
        left: 2%;
        z-index: 2;
      }
      .dc-photo-tag-2 {
        bottom: 16%;
        right: 0%;
        z-index: 2;
      }
      .dc-photo-tag-emoji {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--yellow);
        display: grid;
        place-items: center;
        font-size: 13px;
      }

      /* ============ Image placeholder ============ */
      .dc-ph {
        width: 100%;
        height: 100%;
        background:
          repeating-linear-gradient(
            135deg,
            rgba(26, 24, 20, 0.06) 0 8px,
            transparent 8px 16px
          ),
          linear-gradient(180deg, #eae3ce 0%, #d9cfb1 100%);
        display: grid;
        place-items: center;
        position: relative;
        color: var(--ink-2);
      }
      .dc-ph-label {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.04em;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(255, 254, 247, 0.9);
        border: 1px dashed rgba(26, 24, 20, 0.25);
        text-transform: uppercase;
      }

      /* ============ Booking widget ============ */
      .dc-booking {
        position: relative;
        margin-top: -36px;
        z-index: 5;
      }
      .dc-booking-card {
        background: var(--white);
        border-radius: var(--radius-lg);
        padding: 18px;
        box-shadow: var(--shadow-lg);
        display: grid;
        grid-template-columns: repeat(4, 1fr) auto;
        gap: 8px;
        align-items: stretch;
      }
      .dc-field {
        padding: 10px 18px;
        border-radius: 999px;
        border: 1.5px solid var(--line);
        background: var(--cream);
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 58px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .dc-field:hover {
        border-color: var(--yellow-deep);
      }
      .dc-field-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-3);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 2px;
      }
      .dc-field select,
      .dc-field input {
        border: none;
        background: transparent;
        outline: none;
        font-size: 14.5px;
        font-weight: 600;
        color: var(--ink);
        width: 100%;
        padding: 0;
        appearance: none;
      }
      .dc-booking-go {
        border-radius: 999px;
        background: var(--ink);
        color: var(--yellow);
        padding: 0 28px;
        font-weight: 700;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .dc-booking-go:hover {
        background: var(--yellow);
        color: var(--ink);
      }
      .dc-booking-go:hover .dc-btn-arrow {
        background: var(--ink);
        color: var(--yellow);
      }

      /* ============ Section base ============ */
      .dc-section {
        padding: 100px 0;
        position: relative;
        overflow: hidden;
      }
      .dc-section-light {
        background: var(--cream);
      }
      .dc-section-yellow {
        background: var(--yellow);
      }
      .dc-section-white {
        background: var(--white);
      }

      /* ============ Dark text on yellow accent surfaces (except buttons) ============ */
      /* Section headers sitting directly on yellow bg */
      .dc-section-yellow > .dc-wrap > .dc-section-head .dc-eyebrow-text,
      .dc-section-yellow > .dc-wrap > .dc-section-head .dc-h2,
      .dc-section-yellow > .dc-wrap > .dc-section-head .dc-section-sub,
      .dc-process > .dc-wrap > .dc-section-head .dc-eyebrow-text,
      .dc-process > .dc-wrap > .dc-section-head .dc-h2,
      .dc-process > .dc-wrap > .dc-section-head .dc-section-sub {
        color: var(--ink);
      }
      /* Muted "em" accent inside h2 — lighter version on yellow */
      .dc-section-yellow > .dc-wrap > .dc-section-head .dc-h2 em,
      .dc-process > .dc-wrap > .dc-section-head .dc-h2 em {
        color: rgba(26, 24, 20, 0.45);
      }
      /* Highlighted em (yellow badge with rotation) used in h1, form heading */
      .dc-h1 em,
      .dc-form-side h2 em {
        color: var(--ink);
      }
      /* Pricing call-to-action banner (yellow bg) */
      .dc-pricing-cta h4,
      .dc-pricing-cta p {
        color: var(--ink);
      }
      /* Pricing footnote pill */
      .dc-pricegroup-footnote {
        color: var(--ink);
      }
      /* Modal trainer quote bubble */
      .dc-modal-quote,
      .dc-modal-quote-mark {
        color: var(--ink);
      }
      /* Zoomarket mosaic stat card "500+" */
      .dc-zoomarket-mosaic-card {
        color: var(--ink);
      }
      /* Small yellow circles with icons inside */
      .dc-eyebrow-dot,
      .dc-photo-tag-emoji {
        color: var(--ink);
      }
      /* Success checkmark in contact form */
      .dc-success-icon svg path {
        stroke: var(--ink);
      }

      .dc-section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 32px;
        margin-bottom: 48px;
      }
      .dc-section-head--center {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .dc-section-head--center .dc-eyebrow-text {
        justify-content: center;
      }
      .dc-eyebrow-text {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dc-eyebrow-text::before {
        content: "";
        width: 22px;
        height: 1.5px;
        background: currentColor;
      }
      .dc-h2 {
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(34px, 4vw, 52px);
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin: 0;
        max-width: 720px;
        text-wrap: balance;
      }
      .dc-h2 em {
        font-style: normal;
        color: var(--ink-3);
      }
      .dc-section-sub {
        max-width: 360px;
        color: var(--ink-2);
        font-size: 15.5px;
        /* In the default row layout the subtitle sits on the right of the head,
           so its text reads better right-aligned (flush with the right edge). */
        text-align: right;
      }
      /* Centered heads keep their subtitle centered, not right-aligned */
      .dc-section-head--center .dc-section-sub {
        text-align: center;
      }

      /* ============ Про школу (About) section ============ */
      .dc-about {
        padding: 80px 0 220px; /* big bottom padding — content above the wave zone */
        overflow: visible; /* never clip children — dog overflows below */
        position: relative;
        z-index: 1; /* lower than Services (z:2) so wave masks dog */
        background: var(--yellow);
      }
      .dc-about-grid {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 40px;
        align-items: start; /* text top + photo top aligned to section top */
      }
      .dc-about-content {
        padding-bottom: 60px;
      }
      /* All text in this section is dark on yellow — except the highlight em which inverts */
      .dc-about .dc-eyebrow-text {
        color: rgba(26, 24, 20, 0.55);
      }
      .dc-about .dc-h2 {
        color: var(--ink);
      }
      /* High-specificity to override default `.dc-h2 em { color: var(--ink-3) }` */
      .dc-about .dc-h2 em.dc-about-highlight {
        font-style: normal;
        background: none;
        color: #a8863a; /* muted gold — reads on the yellow bg, no pill */
        padding: 0;
        border-radius: 0;
        display: inline;
        margin: 0;
        box-shadow: none;
      }
      .dc-about-lead {
        color: rgba(26, 24, 20, 0.72);
        font-size: 17px;
        max-width: 560px;
        margin: 22px 0 32px;
      }
      .dc-about-bullets {
        display: flex;
        gap: 32px;
        flex-wrap: wrap;
      }
      .dc-about-bullet {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .dc-about-bullet-ic {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--yellow);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .dc-about-bullet-title {
        font-weight: 700;
        font-size: 14.5px;
        color: var(--ink);
      }
      .dc-about-bullet-sub {
        font-size: 13px;
        color: rgba(26, 24, 20, 0.6);
      }

      /* Right column — just reserves grid width; the dog is anchored to the
         whole section, not this box, so it can be as tall as the section. */
      .dc-about-photo {
        align-self: stretch;
        justify-self: center;
        position: static;
        width: 100%;
        max-width: 360px;
        min-height: 480px;
      }
      /* Dog pinned to the right of the whole About section, full section height,
         bottom tucked under the cream wave. */
      .dc-about-dog {
        position: absolute;
        right: 0; /* pinned to the section's right edge */
        bottom: 0; /* sits at the bottom → lower part hidden by the wave */
        top: auto;
        left: auto;
        height: 100%; /* as tall as the whole section */
        width: auto; /* keep aspect ratio */
        display: block;
        pointer-events: none;
        transform: scaleX(-1); /* mirrored horizontally */
      }
      .dc-about-stat {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 14px 32px;
        text-align: center;
        z-index: 2;
        box-shadow: var(--shadow-md);
      }
      .dc-about-stat-num {
        font-family: var(--display);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .dc-about-stat-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.65;
        margin-top: 4px;
      }

      /* ============ Wave dividers ============ */
      .dc-wave {
        display: block;
        width: 100%;
        height: 60px;
      }
      .dc-wave-divider {
        position: absolute;
        top: -1px;
        left: 0;
        right: 0;
        width: 100%;
        z-index: 2;
        display: block;
        pointer-events: none;
      }

      /* ============ Services tabs ============ */
      .dc-services {
        position: relative;
      }
      .dc-tabs {
        display: flex;
        gap: 8px;
        padding: 8px;
        background: var(--white);
        border-radius: 999px;
        box-shadow: var(--shadow-sm);
        width: max-content;
        margin: 0 auto 48px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .dc-tab {
        padding: 12px 24px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 14.5px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .dc-tab:hover {
        background: var(--yellow-soft);
      }
      .dc-tab.active {
        background: var(--ink);
        color: var(--yellow);
      }
      .dc-tab-icon {
        font-size: 18px;
      }

      .dc-service-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 56px;
        align-items: center;
      }
      .dc-service-photo {
        aspect-ratio: 4 / 3;
        border-radius: var(--radius-lg);
        overflow: hidden;
        position: relative;
        background: var(--yellow-soft);
      }
      .dc-service-photo-frame {
        position: absolute;
        inset: 12px;
        border-radius: calc(var(--radius-lg) - 8px);
        overflow: hidden;
      }
      .dc-service-content h3 {
        font-family: var(--display);
        font-weight: 700;
        font-size: 38px;
        line-height: 1.1;
        letter-spacing: -0.03em;
        margin: 0 0 16px;
      }
      .dc-service-content p {
        color: var(--ink-2);
        font-size: 16px;
        margin: 0 0 24px;
        max-width: 460px;
      }
      .dc-service-features {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin: 0 0 32px;
        padding: 0;
        list-style: none;
      }
      .dc-service-features li {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 600;
      }
      .dc-check {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--yellow);
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 12px;
      }
      .dc-service-price {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 28px;
      }
      .dc-service-price-from {
        font-size: 13px;
        color: var(--ink-3);
        font-weight: 600;
      }
      .dc-service-price-num {
        font-family: var(--display);
        font-weight: 700;
        font-size: 38px;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .dc-service-price-unit {
        color: var(--ink-3);
        font-weight: 600;
      }

      /* ============ Process speech bubbles ============ */
      .dc-process {
        padding: 100px 0;
        background: var(--yellow);
        position: relative;
        overflow: hidden;
      }
      .dc-process-stage {
        position: relative;
        min-height: 540px;
        display: grid;
        place-items: center;
      }
      /* Center dog image — circle background is already baked into the PNG */
      .dc-process-center {
        width: 280px;
        height: auto;
        display: block;
        position: relative;
        z-index: 2;
        margin-top: -140px;
      }
      .dc-bubble {
        position: absolute;
        z-index: 3;
        background: var(--white);
        border-radius: 999px;
        padding: 20px 30px 20px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: var(--shadow-md);
        font-weight: 600;
        transition: transform 0.2s;
        cursor: pointer;
      }
      .dc-bubble:hover {
        transform: scale(1.05);
      }
      .dc-bubble::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        background: var(--white);
        border-radius: 50%;
      }
      .dc-bubble-icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--yellow-soft);
        display: grid;
        place-items: center;
        font-size: 24px;
        flex-shrink: 0;
      }
      .dc-bubble-text {
        display: flex;
        flex-direction: column;
      }
      .dc-bubble-step {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--ink-3);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .dc-bubble-title {
        font-size: 17px;
        font-weight: 700;
      }

      /* Decorative paw clusters on Process sides */
      .dc-process-paws {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 22%;
        max-width: 320px;
        height: auto;
        pointer-events: none;
        z-index: 0;
        opacity: 0.85;
        /* Recolour the paw PNGs: use them as a mask filled with the brand gold */
        background-color: #D1AD36;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-position: center;
        mask-position: center;
      }
      .dc-process-paws-left {
        left: 0;
        aspect-ratio: 304 / 510;
        -webkit-mask-image: url("assets/images/paws-left.png");
        mask-image: url("assets/images/paws-left.png");
      }
      .dc-process-paws-right {
        right: 0;
        aspect-ratio: 334 / 510;
        -webkit-mask-image: url("assets/images/paws-right.png");
        mask-image: url("assets/images/paws-right.png");
      }

      /* Decorative paw clusters in the Contact section (same as Process) */
      .dc-contact-paws {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 22%;
        max-width: 320px;
        height: auto;
        pointer-events: none;
        z-index: 0;
        opacity: 0.85;
        background-color: #D1AD36;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-position: center;
        mask-position: center;
      }
      .dc-contact-paws-left {
        left: 0;
        aspect-ratio: 304 / 510;
        -webkit-mask-image: url("assets/images/paws-left.png");
        mask-image: url("assets/images/paws-left.png");
      }
      .dc-contact-paws-right {
        right: 0;
        aspect-ratio: 334 / 510;
        -webkit-mask-image: url("assets/images/paws-right.png");
        mask-image: url("assets/images/paws-right.png");
      }

      .dc-bubble-1 {
        top: 4%;
        left: 14%;
      }
      .dc-bubble-1::after {
        bottom: -6px;
        right: 20%;
      }
      .dc-bubble-2 {
        top: 2%;
        right: 18%;
      }
      .dc-bubble-2::after {
        bottom: -6px;
        left: 20%;
      }
      .dc-bubble-3 {
        top: 44%;
        left: 4%;
      }
      .dc-bubble-3::after {
        top: 50%;
        right: -6px;
      }
      .dc-bubble-4 {
        top: 44%;
        right: 4%;
      }
      .dc-bubble-4::after {
        top: 50%;
        left: -6px;
      }
      .dc-bubble-5 {
        bottom: 6%;
        left: 22%;
      }
      .dc-bubble-5::after {
        top: -6px;
        right: 14%;
      }
      .dc-bubble-6 {
        bottom: 4%;
        right: 24%;
      }
      .dc-bubble-6::after {
        top: -6px;
        left: 14%;
      }

      /* ============ Team ============ */
      /* Lift the team section up — overlap process bottom slightly */
      #team {
        margin-top: -60px;
        position: relative;
        z-index: 10;
      }

      /* ============ Team — card grid ============ */
      .dc-team-section {
        background: var(--yellow); /* same yellow as the rest of the page */
      }
      .dc-team-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
        margin-top: 48px;
      }
      .dc-tcard {
        background: #fff;
        border-radius: 24px;
        padding: 16px 16px 16px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 18px 40px rgba(26, 24, 20, 0.12);
        cursor: pointer;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .dc-tcard:hover {
        transform: translateY(-6px);
        box-shadow: 0 28px 54px rgba(26, 24, 20, 0.2);
      }
      .dc-tcard-photo {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        aspect-ratio: 1 / 1;
      }
      .dc-tcard-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }
      .dc-tcard-badge {
        position: absolute;
        top: 14px;
        right: 14px;
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 8px 15px;
        font-size: 13.5px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
      }
      .dc-tcard-name {
        font-family: var(--display);
        font-weight: 800;
        font-size: 27px;
        line-height: 1.08;
        letter-spacing: -0.02em;
        color: var(--ink);
        margin: 20px 2px 10px;
      }
      .dc-tcard-role {
        color: var(--ink-3);
        font-size: 15px;
        line-height: 1.4;
        margin: 0 2px 20px;
        flex: 1; /* pushes the footer to the bottom, aligning all cards */
      }
      .dc-tcard-foot {
        border-top: 1px solid #ececec;
        padding: 16px 2px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .dc-tcard-stars {
        display: inline-flex;
        gap: 3px;
        color: #e12e24;
      }
      .dc-tcard-stars svg {
        width: 18px;
        height: 18px;
      }
      .dc-tcard-open {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--ink);
        font-weight: 600;
        font-size: 15px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        transition: gap 0.2s ease;
      }
      .dc-tcard-open:hover {
        gap: 10px;
      }
      @media (max-width: 900px) {
        .dc-team-cards {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 620px) {
        .dc-team-cards {
          display: flex;
          flex-wrap: nowrap;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          scroll-snap-type: x proximity;
          scrollbar-width: none;
          gap: 14px;
          margin-left: -18px;
          margin-right: -18px;
          padding-left: 18px;
          padding-right: 18px;
          padding-bottom: 4px;
          -webkit-mask-image: linear-gradient(to right, transparent, black 18px, black calc(100% - 18px), transparent);
          mask-image: linear-gradient(to right, transparent, black 18px, black calc(100% - 18px), transparent);
        }
        .dc-team-cards::-webkit-scrollbar {
          display: none;
        }
        .dc-tcard {
          flex: 0 0 78%;
          max-width: 300px;
          scroll-snap-align: start;
        }
      }

      /* ============ Team circular ============ */
      .ctm-grid {
        display: grid;
        grid-template-columns: 5fr 6fr;
        gap: 88px;
        align-items: center;
        padding-bottom: 20px;
        margin-top: 88px;
      }
      .ctm-images {
        position: relative;
        height: 520px;
        width: 320px;
        margin-left: auto;
        perspective: 1000px;
      }
      .ctm-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 15%;
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(26,24,20,.28);
        cursor: pointer;
      }
      .ctm-content { display: flex; flex-direction: column; }
      .ctm-badge {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 16px; border-radius: 999px;
        background: rgba(26,24,20,.08);
        border: 1.5px solid rgba(26,24,20,.16);
        color: var(--ink);
        font-size: 11.5px; font-weight: 700; letter-spacing: .06em;
        text-transform: uppercase;
        margin-bottom: 20px; align-self: flex-start;
      }
      .ctm-badge svg { opacity: .75; }
      .ctm-name {
        font-family: var(--display); font-weight: 700;
        font-size: 32px; letter-spacing: -0.025em;
        color: var(--ink); margin: 0 0 8px;
      }
      .ctm-role {
        font-size: 14px; font-weight: 500;
        color: rgba(26,24,20,.6); margin: 0 0 24px;
        letter-spacing: .01em;
      }
      .ctm-quote {
        font-size: 17px; color: rgba(26,24,20,.82);
        line-height: 1.75; margin: 0 0 24px;
        font-style: italic;
      }
      @keyframes ctm-word-in {
        from { filter: blur(8px); opacity: 0; transform: translateY(4px); }
        to   { filter: blur(0);   opacity: 1; transform: translateY(0); }
      }
      .ctm-word {
        display: inline-block;
        animation: ctm-word-in 0.22s ease-in-out both;
      }
      .ctm-skills {
        display: flex; flex-wrap: wrap; gap: 6px;
        list-style: none; padding: 0; margin: 0 0 32px;
      }
      .ctm-skills li {
        font-size: 12px; font-weight: 600;
        padding: 6px 14px; border-radius: 999px;
        background: rgba(26,24,20,.07);
        border: 1px solid rgba(26,24,20,.14);
        color: var(--ink);
      }
      .ctm-arrows {
        display: flex; gap: 10px; align-items: center; margin-bottom: 22px;
      }
      .ctm-btn {
        width: 46px; height: 46px; border-radius: 50%;
        border: none; display: grid; place-items: center;
        cursor: pointer; color: var(--cream);
        transition: background .2s, transform .15s;
      }
      .ctm-btn:hover { transform: scale(1.08); }
      .ctm-open {
        display: flex; align-items: center; gap: 7px;
        padding: 10px 22px; border-radius: 999px;
        border: 1.5px solid rgba(26,24,20,.3);
        background: transparent;
        font-size: 13px; font-weight: 700; cursor: pointer;
        color: var(--ink); margin-left: 8px;
        transition: background .15s, border-color .15s;
        font-family: var(--body);
      }
      .ctm-open:hover {
        background: rgba(26,24,20,.08);
        border-color: rgba(26,24,20,.5);
      }
      .ctm-dots { display: flex; gap: 8px; align-items: center; }
      .ctm-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: rgba(26,24,20,.25); border: none;
        cursor: pointer; padding: 0;
        transition: background .2s, transform .2s;
      }
      .ctm-dot.active { background: var(--ink); transform: scale(1.5); }
      .dc-trainer {
        background: var(--white);
        border-radius: var(--radius-lg);
        padding: 18px;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s;
      }
      .dc-trainer:hover {
        transform: translateY(-4px);
      }
      .dc-trainer-photo {
        aspect-ratio: 4 / 5;
        border-radius: 22px;
        overflow: hidden;
        margin-bottom: 18px;
        position: relative;
        background: var(--yellow-soft);
        cursor: pointer;
      }
      .dc-trainer-badge {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--white);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: var(--shadow-sm);
      }
      .dc-trainer-name {
        font-family: var(--display);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .dc-trainer-role {
        font-size: 13px;
        color: var(--ink-3);
        font-weight: 600;
        margin: 0 0 18px;
      }
      .dc-trainer-foot {
        margin-top: auto;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .dc-trainer-arrow {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--yellow);
        color: #fff;
        display: grid;
        place-items: center;
      }

      /* ============ Pricing ============ */
      .dc-pricing-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
      .dc-plan {
        background: var(--white);
        border-radius: var(--radius-lg);
        padding: 36px 32px;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .dc-plan.featured {
        background: var(--ink);
        color: var(--yellow-soft);
        transform: scale(1.03);
      }
      .dc-plan-tag {
        position: absolute;
        top: -12px;
        left: 32px;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--yellow);
        color: var(--ink);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .dc-plan-name {
        font-family: var(--display);
        font-weight: 600;
        font-size: 22px;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .dc-plan-desc {
        font-size: 14px;
        opacity: 0.7;
        margin: 0 0 24px;
      }
      .dc-plan.featured .dc-plan-desc {
        color: rgba(255, 254, 247, 0.65);
      }
      .dc-plan-price {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-bottom: 28px;
      }
      .dc-plan-amount {
        font-family: var(--display);
        font-weight: 700;
        font-size: 48px;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .dc-plan-unit {
        opacity: 0.6;
        font-size: 14px;
        font-weight: 600;
      }
      .dc-plan-features {
        list-style: none;
        padding: 0;
        margin: 0 0 32px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
      }
      .dc-plan-features li {
        display: flex;
        align-items: start;
        gap: 10px;
        font-size: 14px;
      }
      .dc-plan.featured .dc-check {
        background: var(--yellow);
        color: var(--ink);
      }

      /* ============ Testimonials ============ */
      .dc-testi-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
      .dc-testi {
        background: var(--white);
        border-radius: var(--radius-lg);
        padding: 32px;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .dc-testi-quote {
        font-size: 16px;
        line-height: 1.5;
        color: var(--ink);
        margin: 0 0 24px;
        flex: 1;
        text-wrap: pretty;
      }
      .dc-testi-author {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }
      .dc-testi-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        overflow: hidden;
        background: var(--yellow-soft);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-family: var(--display);
        font-size: 16px;
        color: var(--ink);
        flex-shrink: 0;
      }
      .dc-testi-name {
        font-weight: 700;
        font-size: 14.5px;
      }
      .dc-testi-pet {
        font-size: 12.5px;
        color: var(--ink-3);
        margin-top: 2px;
      }
      .dc-testi-stars {
        color: var(--yellow-deep);
        letter-spacing: 2px;
        font-size: 14px;
        margin-bottom: 14px;
      }

      /* ============ Video slider (Testimonials) ============ */
      .dc-videos {
        margin-top: 56px;
      }
      .dc-videos-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-bottom: 22px;
      }
      .dc-videos-head h3 {
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(22px, 2.4vw, 30px);
        letter-spacing: -0.02em;
        margin: 0;
      }
      .dc-videos-nav {
        display: flex;
        gap: 8px;
      }
      .dc-videos-nav button {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--white);
        color: var(--ink);
        box-shadow: var(--shadow-sm);
        font-family: var(--display);
        font-size: 22px;
        line-height: 1;
        display: grid;
        place-items: center;
        transition:
          background 0.15s,
          transform 0.15s;
      }
      .dc-videos-nav button:hover {
        background: var(--yellow);
        transform: translateY(-1px);
      }
      .dc-videos-track {
        display: flex;
        gap: 22px;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        padding-bottom: 4px;
        margin: 0 -8px;
        padding-left: 8px;
        padding-right: 8px; /* breathing room for shadows */
      }
      .dc-videos-track::-webkit-scrollbar {
        display: none;
      }
      .dc-video {
        flex: 0 0 calc((100% - 44px) / 3);
        scroll-snap-align: start;
        aspect-ratio: 16 / 9;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--ink);
        position: relative;
        box-shadow: var(--shadow-sm);
      }
      .dc-video iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      .dc-video-thumb {
        width: 100%;
        height: 100%;
        display: block;
        padding: 0;
        border: 0;
        position: relative;
        overflow: hidden;
        background: var(--ink);
      }
      .dc-video-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.35s ease;
      }
      .dc-video-thumb:hover img {
        transform: scale(1.04);
      }
      .dc-video-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0) 35%,
          rgba(26, 24, 20, 0.55) 100%
        );
      }
      .dc-video-play {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--yellow);
        color: var(--ink);
        display: grid;
        place-items: center;
        font-size: 22px;
        padding-left: 4px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s;
      }
      .dc-video-thumb:hover .dc-video-play {
        transform: scale(1.1);
      }
      .dc-video-title {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 16px;
        font-size: 14px;
        font-weight: 700;
        text-align: left;
        color: #fff;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      }
      @media (max-width: 960px) {
        .dc-video {
          flex: 0 0 calc((100% - 22px) / 2);
        }
      }
      @media (max-width: 640px) {
        .dc-video {
          flex: 0 0 100%;
        }
      }

      /* ============ CTA / Form ============ */
      .dc-form-card {
        background: var(--white);
        border-radius: var(--radius-xl);
        padding: 56px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 56px;
        box-shadow: var(--shadow-lg);
        position: relative;
        overflow: hidden;
      }
      .dc-form-side h2 {
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(30px, 3.5vw, 42px);
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin: 0 0 16px;
      }
      .dc-form-side h2 em {
        font-style: normal;
        background: var(--yellow);
        padding: 0 12px;
        border-radius: 14px;
        display: inline-block;
      }
      .dc-form-side > p {
        color: var(--ink-2);
        font-size: 16px;
        margin: 0 0 24px;
      }
      .dc-contact-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
        font-weight: 600;
        font-size: 15px;
      }
      .dc-contact-ic {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--yellow);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .dc-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .dc-form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .dc-input-wrap {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .dc-input-label {
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-3);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding-left: 18px;
      }
      .dc-input {
        padding: 16px 20px;
        border-radius: 999px;
        border: 1.5px solid var(--line);
        background: var(--cream);
        font-size: 14.5px;
        font-weight: 600;
        outline: none;
        transition: border-color 0.15s;
        width: 100%;
      }
      .dc-input:focus {
        border-color: var(--ink);
        background: var(--white);
      }
      textarea.dc-input {
        border-radius: 22px;
        min-height: 100px;
        resize: vertical;
        font-family: inherit;
      }
      .dc-pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .dc-pill {
        padding: 10px 18px;
        border-radius: 999px;
        border: 1.5px solid var(--line);
        font-weight: 600;
        font-size: 13.5px;
        background: var(--white);
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
      }
      .dc-pill:hover {
        border-color: var(--ink);
      }
      .dc-pill.active {
        background: var(--ink);
        color: var(--yellow);
        border-color: var(--ink);
      }
      .dc-form-submit {
        margin-top: 8px;
        padding: 18px 28px;
        border-radius: 999px;
        background: var(--yellow);
        color: var(--ink);
        font-weight: 800;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition:
          background 0.15s,
          transform 0.15s;
      }
      .dc-form-submit:hover {
        background: var(--yellow-deep);
        transform: translateY(-1px);
      }

      .dc-form-success {
        position: absolute;
        inset: 0;
        background: var(--white);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 40px;
        text-align: center;
        animation: dc-fadein 0.4s ease;
      }
      @keyframes dc-fadein {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
        }
      }
      .dc-success-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--yellow);
        display: grid;
        place-items: center;
        font-size: 36px;
      }

      /* ============ Footer ============ */
      .dc-footer {
        background: var(--ink);
        color: var(--cream);
        padding: 80px 0 32px;
        position: relative;
        overflow: hidden;
      }
      .dc-footer-grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr;
        gap: 48px;
        margin-bottom: 56px;
      }
      .dc-footer h4 {
        font-family: var(--display);
        font-weight: 600;
        font-size: 14px;
        margin: 0 0 18px;
        color: var(--yellow);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .dc-footer ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .dc-footer ul a,
      .dc-footer ul li {
        font-size: 14px;
        opacity: 0.7;
        transition: opacity 0.15s;
      }
      .dc-footer ul a:hover {
        opacity: 1;
      }
      .dc-footer-logo {
        font-family: var(--display);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -0.03em;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .dc-footer-logo-mark {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--yellow);
        color: var(--ink);
        display: grid;
        place-items: center;
        font-size: 24px;
      }
      .dc-footer-desc {
        font-size: 14px;
        opacity: 0.65;
        max-width: 280px;
        margin-bottom: 24px;
      }
      .dc-socials {
        display: flex;
        gap: 8px;
      }
      .dc-social {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(255, 254, 247, 0.15);
        display: grid;
        place-items: center;
        font-size: 16px;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .dc-social:hover {
        background: var(--yellow);
        color: var(--ink);
        border-color: var(--yellow);
      }
      .dc-footer-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 28px;
        border-top: 1px solid rgba(255, 254, 247, 0.1);
        font-size: 13px;
        opacity: 0.5;
        flex-wrap: wrap;
        gap: 12px;
      }

      /* ============ Marquee ============ */
      .dc-marquee {
        padding: 22px 0;
        background: var(--ink);
        color: var(--yellow);
        overflow: hidden;
        border-radius: 0;
      }
      .dc-marquee-track {
        display: flex;
        gap: 56px;
        animation: dc-scroll 32s linear infinite;
        white-space: nowrap;
        font-family: var(--display);
        font-weight: 600;
        font-size: 30px;
        letter-spacing: -0.02em;
      }
      .dc-marquee-track span {
        display: flex;
        align-items: center;
        gap: 56px;
      }
      @keyframes dc-scroll {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      /* ============ Modal ============ */
      .dc-modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(26, 24, 20, 0.55);
        backdrop-filter: blur(8px);
        display: grid;
        place-items: center;
        padding: 32px 20px;
        overflow-y: auto;
        animation: dc-fadein 0.25s ease;
      }
      .dc-modal {
        background: var(--cream);
        border-radius: var(--radius-xl);
        width: 100%;
        max-width: 920px;
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        overflow: hidden;
        position: relative;
        box-shadow: var(--shadow-lg);
        animation: dc-modal-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        margin: auto;
      }
      @keyframes dc-modal-in {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .dc-modal-close {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--white);
        color: var(--ink);
        display: grid;
        place-items: center;
        z-index: 4;
        box-shadow: var(--shadow-sm);
        transition:
          background 0.15s,
          transform 0.15s;
      }
      .dc-modal-close:hover {
        background: var(--yellow);
        transform: rotate(90deg);
      }
      .dc-modal-photo {
        position: relative;
        background: var(--yellow-soft);
        min-height: 540px;
      }
      .dc-modal-photo > img,
      .dc-modal-photo > .dc-ph {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .dc-modal-photo-tag {
        position: absolute;
        bottom: 24px;
        left: 24px;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--white);
        font-size: 13px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: var(--shadow-md);
        color: var(--ink);
      }
      .dc-modal-body {
        padding: 44px 44px 36px;
        max-height: 86vh;
        overflow-y: auto;
      }
      .dc-modal-body::-webkit-scrollbar {
        width: 6px;
      }
      .dc-modal-body::-webkit-scrollbar-thumb {
        background: var(--line-2);
        border-radius: 3px;
      }
      .dc-modal-name {
        font-family: var(--display);
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
        margin: 0 0 16px;
      }
      .dc-modal-bio {
        color: var(--ink-2);
        font-size: 15px;
        margin: 0 0 24px;
        text-wrap: pretty;
      }
      .dc-modal-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        background: var(--white);
        border-radius: 20px;
        padding: 18px;
        margin-bottom: 24px;
      }
      .dc-modal-stats > div {
        text-align: center;
      }
      .dc-modal-stat-num {
        font-family: var(--display);
        font-weight: 700;
        font-size: 24px;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .dc-modal-stat-label {
        font-size: 11.5px;
        color: var(--ink-3);
        margin-top: 4px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .dc-modal-quote {
        position: relative;
        background: var(--yellow);
        border-radius: 20px;
        padding: 20px 22px 20px 56px;
        font-size: 14.5px;
        font-weight: 600;
        font-style: italic;
        margin-bottom: 24px;
        line-height: 1.45;
        text-wrap: pretty;
      }
      .dc-modal-quote-mark {
        position: absolute;
        top: 18px;
        left: 18px;
        width: 28px;
        height: 24px;
        fill: currentColor;
        color: var(--ink);
        opacity: 0.32;
      }
      .dc-modal-section {
        margin-bottom: 22px;
      }
      .dc-modal-section h4 {
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin: 0 0 10px;
      }
      .dc-modal-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .dc-modal-chip {
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--white);
        font-size: 13px;
        font-weight: 600;
        border: 1.5px solid var(--line);
      }
      .dc-modal-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .dc-modal-list li {
        display: flex;
        align-items: start;
        gap: 10px;
        font-size: 14px;
        font-weight: 500;
      }
      .dc-modal-row {
        display: flex;
        gap: 16px;
        margin-bottom: 8px;
      }
      .dc-modal-cta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        margin-top: 12px;
      }

      .dc-trainer {
        width: 100%;
      }
      button.dc-trainer {
        border: none;
        background: var(--white);
      }

      /* ============ Responsive ============ */
      .dc-section-with-wave {
        padding-top: 150px;
      }
      .dc-process.dc-section-with-wave {
        padding-top: 160px;
      }
      .dc-footer.dc-section-with-wave {
        padding-top: 140px;
      }
      #zoomarket.dc-section-with-wave {
        padding-top: 40px;
        padding-bottom: 70px;
      }
      /* Services section: no lift — wave sits flush against the about photo bottom,
   so dog body merges cleanly into the wave curve / white transition. */
      /* Services lifted ~500px up over About. The cream wave at its top moves
   with it, covering the bottom half of the dog photo. */
      .dc-services-section {
        position: relative;
        z-index: 2; /* higher than About (z:1) — masks dog legs */
        margin-top: -80px; /* pulls section up over About's dog overflow */
        padding-top: 120px !important;
        overflow: visible !important; /* let the top wave bleed above the section */
      }
      /* Organic cream wave at top of Services — multiple peaks/dips, fluid shape.
   Stretches to full width (preserveAspectRatio="none" on the SVG). */
      .dc-services-wave {
        position: absolute;
        left: 0;
        right: 0;
        top: -120px;
        width: 100%;
        height: 200px;
        display: block;
        pointer-events: none;
        z-index: 3;
      }
      .dc-services-wave-top {
        position: absolute;
        left: 0;
        right: 0;
        top: -1px;
        width: 100%;
        height: 80px;
        z-index: 1;
        display: block;
        pointer-events: none;
      }
      #pricing {
        /* Enough room for the last card's ~100px-tall drop-shadow to fade out
           inside the white zone — otherwise it bleeds under the next section's
           white wave (absolute, z-index:2), which paints over it.
           NB: this ID selector overrides the .pkg-section padding-bottom. */
        padding-bottom: 150px;
      }

      /* ============ Кінолог на виїзд ============ */
      .dc-kinolog-layout {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 64px;
        align-items: center;
      }
      /* Text colors on yellow kinolog section */
      #kinolog .dc-eyebrow-text {
        color: rgba(26, 24, 20, 0.55);
      }
      #kinolog .dc-h2 {
        color: var(--ink);
      }
      #kinolog .dc-h2 em {
        color: var(--ink);
        -webkit-text-stroke: 1.5px var(--ink);
        background: none;
      }
      #kinolog .dc-kinolog-desc {
        color: rgba(26, 24, 20, 0.72);
      }
      #kinolog .dc-service-features li {
        color: var(--ink);
      }
      #kinolog .dc-check {
        background: rgba(26, 24, 20, 0.12);
      }
      #kinolog .dc-check path {
        stroke: var(--ink);
      }
      #kinolog .dc-service-price-from,
      #kinolog .dc-service-price-unit {
        color: rgba(26, 24, 20, 0.55);
      }
      #kinolog .dc-service-price-num {
        color: var(--ink);
      }

      .dc-kinolog-desc {
        color: var(--ink-2);
        font-size: 17px;
        line-height: 1.65;
        margin: 20px 0 28px;
        max-width: 520px;
      }
      .dc-kinolog-card {
        background: var(--ink);
        color: var(--cream);
        border-radius: 28px;
        padding: 44px 36px 40px;
        text-align: center;
      }
      .dc-kinolog-card-icon {
        font-size: 52px;
        margin-bottom: 10px;
      }
      .dc-kinolog-card-title {
        font-size: 18px;
        font-weight: 800;
        color: var(--yellow);
        margin-bottom: 32px;
        letter-spacing: -0.01em;
      }
      .dc-kinolog-card-facts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .dc-kinolog-fact-num {
        font-size: 20px;
        font-weight: 800;
        color: var(--cream);
        line-height: 1.1;
      }
      .dc-kinolog-fact-label {
        font-size: 11px;
        color: rgba(255, 254, 247, 0.5);
        margin-top: 4px;
        line-height: 1.3;
      }
      @media (max-width: 860px) {
        .dc-kinolog-layout {
          grid-template-columns: 1fr;
        }
        .dc-kinolog-card {
          order: -1;
        }
        .dc-kinolog-card-facts {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* ============ Pricing ============ */
      .dc-price-tabs {
